---
name: Syndicate New Posts
on:
    workflow_call:
        inputs:
            before_sha:
                required: true
                type: string
            current_sha:
                required: true
                type: string

jobs:
    syndicate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Syndicate new posts to Bridgy and rss.chat
              continue-on-error: true
              env:
                  BASE_URL: ${{ vars.BASE_URL }}
                  BRIDGY_WEBMENTION_URL: ${{ vars.BRIDGY_WEBMENTION_URL }}
                  RSS_CHAT_URL: ${{ secrets.DEMO_RSS_CHAT_URL }}
                  RSS_CHAT_USERNAME: ${{ secrets.DEMO_RSS_CHAT_USERNAME }}
                  RSS_CHAT_EMAIL: ${{ secrets.DEMO_RSS_CHAT_EMAIL }}
                  RSS_CHAT_CODE: ${{ secrets.DEMO_RSS_CHAT_CODE }}
                  TEXTLOG_TOKEN: ${{ secrets.TEXTLOG_TOKEN }}
              run: |
                  bash .github/scripts/syndicate-new-posts.sh \
                    "${{ inputs.before_sha }}" \
                    "${{ inputs.current_sha }}"
