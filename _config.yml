highlighter: rouge
permalink: ./:title
title: "Weak Notes"
description: "// A working in public, second brain"
version: 2.0.0
port: 2012
theme:
url: https://thechels.uk
owner:
  name: "thechelsuk"
  email: "feedback@thechels.uk"
  url: "https://thechels.uk/about"
  avatar: "https://thechels.uk/.well-known/avatar.png"
  sameAs:
    - "https://reddit.com/user/thechelsuk"
    - "https://youtube.com/thechelsuk"
    - "https://bsky.app/profile/thechels.uk"
    - "https://twitch.tv/thechelsuk"
    - "https://github.com/thechelsuk"
    - "https://keybase.io/thechelsuk"
  jobTitle: "Owner"
  worksFor: "thechelsuk"
organization:
  name: "thechelsuk"
  url: "https://thechels.uk"
  logo: "https://thechels.uk/.well-known/avatar.png"
  sameAs:
    - "https://reddit.com/user/thechelsuk"
    - "https://youtube.com/thechelsuk"
    - "https://bsky.app/profile/thechels.uk"
    - "https://twitch.tv/thechelsuk"
    - "https://github.com/thechelsuk"
    - "https://keybase.io/thechelsuk"

baseurl: ""
timezone: Europe/London
encoding: UTF-8
future: false
github:
  repository_url: https://github.com/thechelsuk/uk.thechels
  branch: main
sass:
  style: compressed
## Collections
collections:
  projects:
    output: true
    sort_by: class
    permalink: ./projects/:title
  rides:
    output: true
    sort_by: date
    permalink: ./rides/:title
  bookmarks:
    output: true
    sort_by: date
    permalink: ./link/:title
## Webmentions
webmentions:
  username: thechels.uk
  cache_folder: .cache
  cache_bad_uris_for: 5
  js: false
  throttle_lookups:
    last_week: daily
    last_month: weekly
    last_year: monthly
    older: monthly
  syndication:
    indienews:
      endpoint: https://news.indieweb.org/en
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      syndicate: false
plugins:
  - jekyll-avatar
  - jekyll-github-metadata
  - jekyll-webmention_io
exclude:
  - CNAME
  - README.md
  - LICENSE.md
  - SECURITY.md
  - _python/
  - .github/
  - .sass-cache/
  - .jekyll-cache/
  - htmlcov/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - assets/
include:
  - ".well-known"
  - "_pages"
  - "_headers"

